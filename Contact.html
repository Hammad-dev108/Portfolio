<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Contact - Hammed Ahmed</title>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Hammed <span>Ahmed</span></div>

            <div class="links">
                <div class="link"><a href="index.html">Home</a></div>
                <div class="link"><a href="About.html">About</a></div>

    <section class="contact-section">
        <div class="content">
            <h1>Contact <span>Me</span></h1>
            <p>Feel free to contact me for any project or collaboration.</p>

            <form class="contact-form" action="mailto:your-email@example.com" method="post" enctype="text/plain">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <input type="text" name="subject" placeholder="Subject" required>
                <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>

            <div class="contact-info">
                <p><i class="fa-solid fa-envelope"></i> your-email@example.com</p>
                <p><i class="fa-solid fa-phone"></i> +92 300 0000000</p>
            </div>
        </div>
    </section>
</body>
